# =====================================================================
# LuminIRIS - one-command deployment
# Usage:
#   docker compose up -d --build
# Portal:
#   http://localhost:52773/csp/user/luminiris/index.html
# =====================================================================
services:
  luminiris:
    build: .
    image: luminiris:2.1.0
    container_name: luminiris
    # IRIS 2026.2+: do not start the ISC Agent daemon. On hosts where it
    # cannot run (WSL1/older kernels/missing cgroups), the post-startup
    # iris-after-start hook exits 256 and the container fatals. It is not
    # needed for this single-node demo portal.
    command: /iris-main --ISCAgent false
    ports:
      - "52773:52773"   # Web Gateway: Management Portal / SysAdmin API / LuminIRIS
      - "1972:1972"     # SuperServer (container default)
    environment:
      # Password for the predefined accounts (_SYSTEM, etc.).
      # Community Edition default is SYS; override for any real use.
      - IRIS_PASSWORD=SYS
    restart: unless-stopped
